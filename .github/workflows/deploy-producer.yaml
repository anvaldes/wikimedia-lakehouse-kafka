name: Deploy producer
on:
  push:
    branches:
      - main
    paths:
      - 'ingestion/producer/**'
      - 'shared/**'
      - '.github/workflows/deploy-producer.yaml'

env:
  PROJECT_ID: lab-experiments-514316
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  AR_REPO: wikimedia-lakehouse-kafka
  SERVICE_ACCOUNT: portfolio-runtime@lab-experiments-514316.iam.gserviceaccount.com
  PROJECT_NUMBER: '115741533268'
  IMAGE_NAME: wikimedia-lakehouse-kafka-producer
  WORKER_POOL_NAME: wikimedia-lakehouse-kafka-producer
  DOCKERFILE: ingestion/producer/Dockerfile
  KAFKA_BOOTSTRAP: bootstrap-q-f3vwmc9slirwmoy56bewqjl.a6424b16f.us-central1.managedkafka.s.cloud.goog:9092
  KAFKA_TOPIC: recentchange
  CHECKPOINT_BUCKET: lab-experiments-514316-wikimedia-lakehouse
  WIKIMEDIA_USER_AGENT: wikimedia-lakehouse-kafka/0.1 (https://github.com/anvaldes/wikimedia-lakehouse-kafka)

jobs:
  deploy-producer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set full image path
        run: echo "IMAGE=${REGISTRY}/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      # 1. Build image (context = repo root, so shared/ is included)
      - name: Build Docker image
        run: docker build --platform linux/amd64 -f "$DOCKERFILE" -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      # 2. Push image to Artifact Registry
      - name: Push Docker image
        run: docker push --all-tags "$IMAGE"

      # 3. Deploy to Cloud Run worker pool
      - name: Deploy to Cloud Run worker pool
        run: |
          gcloud run worker-pools deploy "$WORKER_POOL_NAME" \
            --image="$IMAGE:${{ github.sha }}" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --service-account="$SERVICE_ACCOUNT" \
            --instances=1 \
            --network=default \
            --subnet=default \
            --vpc-egress=all-traffic \
            --set-env-vars="KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP},KAFKA_TOPIC=${KAFKA_TOPIC},CHECKPOINT_BUCKET=${CHECKPOINT_BUCKET},WIKIMEDIA_USER_AGENT=${WIKIMEDIA_USER_AGENT}" \
            --quiet