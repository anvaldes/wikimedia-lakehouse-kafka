name: Upload jobs
on:
  push:
    branches:
      - main
    paths:
      - 'processing/**'
      - 'shared/**'
      - '.github/workflows/upload-jobs.yaml'

env:
  BUCKET: wikimedia-lakehouse-kafka

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python 3.11 + Java 17 = Dataproc Serverless runtime 2.2. Spark 3.5 fails on Java 23+.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q

  upload-jobs:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # 1. Package processing/ + shared/ for --py-files (job entry points are uploaded separately)
      - name: Package code
        run: zip -r processing.zip processing shared -x '*__pycache__*' 'processing/scripts/*'

      # 2. Upload to gs://<bucket>/code/ (every job entry point in processing/jobs/)
      - name: Upload to GCS
        run: |
          gcloud storage cp processing.zip "gs://${BUCKET}/code/processing.zip"
          gcloud storage cp processing/jobs/*.py "gs://${BUCKET}/code/jobs/"
